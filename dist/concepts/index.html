<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio por concepto</title><link rel="stylesheet" href="lab.css"></head><body><header><div><span class="eyebrow">LABORATORIO DE CONCEPTO</span><h1 id="title"></h1></div><span class="live"><i></i> MODELO INTERACTIVO</span></header><div class="screen"><canvas id="scene" width="1000" height="520" role="img"></canvas><div class="legend" id="legend"></div></div><div class="metrics" id="metrics" aria-live="off"></div><div class="controls"><label><span id="la"></span><output id="oa"></output><input id="a" type="range"></label><label><span id="lb"></span><output id="ob"></output><input id="b" type="range"></label></div><div class="transport"><button id="play">Pausar</button><button id="reset">Reiniciar</button><button id="toggle" hidden>Cambiar estado</button><label>Recorrer tiempo<input id="scrub" type="range" min="0" max="10" step=".01" value="0" aria-label="Tiempo de reproducción"></label><label>Velocidad visual<select id="speed" aria-label="Velocidad de reproducción"><option value=".25">0,25×</option><option value=".5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="zoom" aria-pressed="false">Zoom ×1,6</button><button id="capture">Comparar A/B</button><button id="expand">Ampliar ↗</button></div><div id="comparison" hidden></div><div class="observe"><b>PRUEBA ESTO</b><p id="experiment"></p><p id="insight"></p></div><details><summary>Modelo, unidades y límites</summary><p id="limit"></p></details><section id="challenge" hidden><h2>Tu turno: predice y comprueba</h2><p id="challengeQuestion"></p><form id="challengeForm"><label>Tu respuesta <input id="challengeInput" inputmode="decimal" required autocomplete="off" aria-label="Respuesta numérica"></label><button>Comprobar</button></form><p id="challengeFeedback" role="status"></p></section><script type="module" src="lab.mjs"></script></body></html>
