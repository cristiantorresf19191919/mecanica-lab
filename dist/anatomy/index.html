<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anatomía de una máquina · Mecánica</title><link rel="stylesheet" href="iso.css"><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#eeeee6;color:#26382e;font-family:system-ui,sans-serif}.figure{padding:18px 22px}.iso[data-theme="light"]{--anatomy-shade-0:#9ba99b;--anatomy-shade-1:#bcc6b7;--anatomy-shade-2:#d5ddcb;--anatomy-shade-3:#e5eadc;--anatomy-mid:#64735f;--anatomy-lo:#929e87;--anatomy-lit-top:#d7e6b5;--anatomy-lit-shade:#b5c88b}.top,.bottom{display:flex;justify-content:space-between;gap:15px;align-items:center;font-size:12px}.top{border-bottom:1px solid #cbd2c4;padding-bottom:13px}.top span,.read{font:11px monospace;text-transform:uppercase}.top strong{font-weight:600}#stage{height:350px}#stage svg{height:100%;width:100%}.bottom{padding:12px 0;border-top:1px solid #cbd2c4}.read{font-size:12px;line-height:1.6;text-align:right}.controls{display:flex;align-items:center;gap:12px}button{background:transparent;border:1px solid #87937c;border-radius:4px;padding:8px 12px;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #748f41;outline-offset:3px}label{flex:1;font-size:11px}input{display:block;width:100%;accent-color:#496d3b;margin-top:9px}#caption{font-size:12px;line-height:1.65;margin:13px 0 0;min-height:60px;color:#586253}#phase{font-weight:650} @media(max-width:500px){.figure{padding:12px}#stage{height:250px}.top{font-size:11px}.top span{font-size:9px}.bottom{align-items:flex-start}.controls{flex-wrap:wrap;gap:8px}.controls label{min-width:100%}#caption{font-size:11px}.read{font-size:10px}}@media(prefers-color-scheme:dark){body{background:#eeeee6;color:#26382e}}
</style><body><main class="figure iso" data-theme="light"><div class="top"><span>ATLAS / ANATOMY</span><strong id="title"></strong></div><div id="stage"></div><div class="bottom"><span id="phase"></span><output class="read" id="readout"></output></div><div class="controls"><label><span id="control-label">Explorar</span><input id="position" type="range" min="0" max="1000" value="250" aria-label="Explorar el mecanismo"></label><button id="pause">Pausar</button><button id="reset">Reiniciar</button></div><label id="stroke-control" hidden style="display:block;margin-top:10px">Extensión del pistón · independiente de la presión<input id="stroke" type="range" min="0" max="100" value="50" aria-label="Extensión del pistón"></label><p id="caption"></p></main><script type="module" src="figure.mjs"></script></body></html>
